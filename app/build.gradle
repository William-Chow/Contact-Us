android {
    namespace = 'com.kotlin.mvvm.contact'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.kotlin.mvvm.contact"
        minSdk = 28
        targetSdk = 36
        versionCode = 6
        versionName = "5.1"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    // Release signing reads key.properties (git-ignored) at the repo root.
    // Expected keys: storeFile, storePassword, keyAlias, keyPassword.
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("key.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose = true
    }
    testOptions {
        // Robolectric tests read string resources
        unitTests.includeAndroidResources = true
    }
}

// Commit each exported schema: the database holds the only copy of the user's contacts, so every
// version bump needs a migration, and these files are the history migrations are checked against.
room {
    schemaDirectory "$projectDir/schemas"
}

